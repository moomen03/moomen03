name: Update Living Profile Dashboard

on:
  schedule:
    # Runs every 6 hours. Adjust to your account's actual activity
    # rate — hourly is wasteful for an account with a handful of
    # pushes a week; daily is fine for most people.
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    # Avoid infinite loop: don't retrigger on the bot's own commits.
    paths-ignore:
      - "README.md"
      - "assets/svg/**"
      - "data/cache/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: profile-dashboard
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Fetch GitHub-native data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_LOGIN: ${{ github.repository_owner }}
        run: npm run fetch

      - name: Compute identity model
        run: npm run identity

      - name: Check whether identity actually changed
        id: diff
        run: echo "changed=$(cat data/cache/identity.changed)" >> "$GITHUB_OUTPUT"

      - name: Render SVG assets
        if: steps.diff.outputs.changed == 'true'
        run: npm run render:svg

      - name: Render README
        if: steps.diff.outputs.changed == 'true'
        run: npm run render:readme

      - name: Validate generated SVGs
        if: steps.diff.outputs.changed == 'true'
        # Fail fast if any renderer produced malformed XML, so the bot never
        # commits a broken dashboard. Uses Node's built-in checks only — no
        # extra dependency.
        run: |
          node -e '
            const fs = require("fs");
            const dir = "assets/svg";
            const files = fs.readdirSync(dir).filter(f => f.endsWith(".svg"));
            if (files.length === 0) { console.error("No SVGs generated"); process.exit(1); }
            for (const f of files) {
              const s = fs.readFileSync(`${dir}/${f}`, "utf-8");
              if (!s.trim().startsWith("<svg") || !s.trim().endsWith("</svg>")) {
                console.error(`Malformed SVG: ${f}`); process.exit(1);
              }
            }
            console.log(`Validated ${files.length} SVG files.`);
          '

      - name: Commit and push if changed
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "profile-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md assets/svg data/cache/identity.json
          if git diff --cached --quiet; then
            echo "Identity model changed but no file diff staged — nothing to push."
          else
            git commit -m "chore(dashboard): regenerate from live GitHub data"
            git push
          fi
