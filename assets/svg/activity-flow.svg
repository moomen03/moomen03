<svg width="640" height="160" viewBox="0 0 640 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Activity flow">
  <defs>
    <linearGradient id="panel-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f151c"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="640" height="160" rx="10" fill="url(#panel-bg)" stroke="#30363d"/>
  <text x="20" y="26" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="13" font-weight="700" fill="#58a6ff" text-anchor="start">ACTIVITY FLOW</text>
  <rect x="20" y="32" width="104" height="2" rx="1" fill="url(#accent-grad)" opacity="0.7"/>
  <text x="620" y="26" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="11" font-weight="400" fill="#8b949e" text-anchor="end">PR merge rate 0% · issue close rate 0%</text>
  <circle cx="60" cy="60" r="5" fill="#58a6ff"/>
  <circle cx="580" cy="60" r="5" fill="#3fb950"/>
  <line x1="60" y1="60" x2="580" y2="60" stroke="#30363d" stroke-width="2"/>
      <circle r="4" fill="#58a6ff" filter="url(#glow)">
          <animateMotion dur="6s" begin="0s" repeatCount="indefinite"
            path="M60,60 L580,60"/>
        </circle>
<circle r="4" fill="#58a6ff" filter="url(#glow)">
          <animateMotion dur="6s" begin="2s" repeatCount="indefinite"
            path="M60,60 L580,60"/>
        </circle>
<circle r="4" fill="#58a6ff" filter="url(#glow)">
          <animateMotion dur="6s" begin="4s" repeatCount="indefinite"
            path="M60,60 L580,60"/>
        </circle>
      <text x="60" y="48" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="11" font-weight="400" fill="#8b949e" text-anchor="start">pull requests opened → merged</text>
      <text x="580" y="48" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12" font-weight="700" fill="#58a6ff" text-anchor="end">0</text>
  <circle cx="60" cy="110" r="5" fill="#d29922"/>
  <circle cx="580" cy="110" r="5" fill="#3fb950"/>
  <line x1="60" y1="110" x2="580" y2="110" stroke="#30363d" stroke-width="2"/>
      <circle r="4" fill="#d29922" filter="url(#glow)">
          <animateMotion dur="6s" begin="0s" repeatCount="indefinite"
            path="M60,110 L580,110"/>
        </circle>
<circle r="4" fill="#d29922" filter="url(#glow)">
          <animateMotion dur="6s" begin="2s" repeatCount="indefinite"
            path="M60,110 L580,110"/>
        </circle>
<circle r="4" fill="#d29922" filter="url(#glow)">
          <animateMotion dur="6s" begin="4s" repeatCount="indefinite"
            path="M60,110 L580,110"/>
        </circle>
      <text x="60" y="98" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="11" font-weight="400" fill="#8b949e" text-anchor="start">issues opened → closed</text>
      <text x="580" y="98" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12" font-weight="700" fill="#d29922" text-anchor="end">0</text>
</svg>